<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinefex Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark blue-gray background */
        }
        .magazine-cover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .magazine-cover:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 6px 6px rgba(0, 0, 0, 0.3);
        }
        .modal-overlay, #viewer {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>
<body class="text-white">

    <!-- Header -->
    <header class="py-6 px-4 sm:px-6 lg:px-8 bg-gray-900/80 backdrop-blur-sm sticky top-0 z-20">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white">Cinefex Archives</h1>
            <p class="mt-2 text-lg text-gray-400">A tribute to the journal of cinematic illusions.</p>
            <!-- Navigation for buckets -->
            <nav id="bucket-nav" class="mt-6">
                <div class="flex flex-wrap justify-center gap-2">
                    <!-- Navigation links will be dynamically inserted here -->
                </div>
            </nav>
        </div>
    </header>

    <!-- Magazine Grid -->
    <main id="magazine-grid" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
        <!-- Loading indicator -->
        <p id="loading-indicator" class="text-center col-span-full text-gray-400">Loading archive...</p>
    </main>

    <!-- Details Modal -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div id="modal-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        <div id="modal-content" class="relative bg-gray-800 rounded-lg shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden">
            <!-- Modal content will be dynamically inserted here -->
        </div>
    </div>

    <!-- Iframe Viewer -->
    <div id="viewer" class="fixed inset-0 z-[60] bg-gray-900 hidden">
        <iframe id="viewer-iframe" class="w-full h-full border-0" allowfullscreen></iframe>
        <button id="viewer-close" class="absolute top-4 right-4 text-gray-300 hover:text-white bg-black/50 rounded-full p-2 transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('magazine-grid');
            const navContainer = document.querySelector('#bucket-nav div');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            const modal = document.getElementById('modal');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');

            const viewer = document.getElementById('viewer');
            const viewerIframe = document.getElementById('viewer-iframe');
            const viewerCloseBtn = document.getElementById('viewer-close');

            /**
             * Fetches issue data from a JSON file and initializes the application.
             */
            async function initializeArchive() {
                try {
                    const response = await fetch('issues.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const allMagazines = await response.json();
                    loadingIndicator.style.display = 'none';
                    renderMagazines(allMagazines);
                } catch (error) {
                    loadingIndicator.textContent = 'Failed to load archive data. Please make sure issues.json is in the correct directory.';
                    console.error("Error loading archive data:", error);
                }
            }
            
            function renderMagazines(magazines) {
                grid.innerHTML = '';
                const buckets = magazines.reduce((acc, magazine) => {
                    let bucketKey;
                    if (magazine.year <= 1985) bucketKey = '1980-1985';
                    else {
                        const startYear = Math.floor((magazine.year - 1) / 5) * 5 + 1;
                        const endYear = startYear + 4;
                        bucketKey = `${startYear}-${endYear}`;
                    }
                    if (!acc[bucketKey]) acc[bucketKey] = [];
                    acc[bucketKey].push(magazine);
                    return acc;
                }, {});

                const sortedBucketKeys = Object.keys(buckets).sort((a, b) => parseInt(a.split('-')[0]) - parseInt(b.split('-')[0]));
                renderNavigation(sortedBucketKeys);

                sortedBucketKeys.forEach(key => {
                    const bucketContainer = document.createElement('section');
                    bucketContainer.id = `bucket-${key}`;
                    bucketContainer.className = 'pt-24 -mt-24';
                    const header = document.createElement('h2');
                    header.className = 'text-3xl font-bold mt-12 mb-6 text-cyan-400 border-b border-gray-700 pb-2';
                    header.textContent = key;
                    bucketContainer.appendChild(header);
                    const bucketGrid = document.createElement('div');
                    bucketGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8';
                    buckets[key].forEach(magazine => {
                        const coverElement = document.createElement('div');
                        coverElement.className = 'magazine-cover cursor-pointer group';
                        
                        // Use standardized cover images from covers folder
                        const coverPath = `covers/${magazine.issue}/cover512.jpg`;
                        const fallbackLogic = `this.onerror=null; this.src='https://placehold.co/450x400/111827/ffffff?text=Issue+${magazine.issue}'`;
                        coverElement.innerHTML = `<img src="${coverPath}" alt="Cover of Cinefex Issue ${magazine.issue}" class="w-full rounded-lg shadow-lg object-cover" onerror="${fallbackLogic}"><div class="mt-3 text-center"><h3 class="font-semibold text-white">Issue ${magazine.issue}</h3><p class="text-sm text-gray-400 group-hover:text-white transition-colors">${magazine.year}</p></div>`;
                        coverElement.addEventListener('click', () => openModal(magazine));
                        bucketGrid.appendChild(coverElement);
                    });
                    bucketContainer.appendChild(bucketGrid);
                    grid.appendChild(bucketContainer);
                });
            }

            function renderNavigation(bucketKeys) {
                navContainer.innerHTML = '';
                bucketKeys.forEach(key => {
                    const link = document.createElement('a');
                    link.href = `#bucket-${key}`;
                    link.textContent = key;
                    link.className = 'px-3 py-1 bg-gray-700 text-gray-300 rounded-full text-sm font-semibold hover:bg-cyan-500 hover:text-white transition-colors';
                    navContainer.appendChild(link);
                });
            }
            
            function openModal(magazine) {
                // Use standardized cover images from covers folder
                const coverPath = `covers/${magazine.issue}/cover512.jpg`;
                const fallbackLogic = `this.onerror=null; this.src='https://placehold.co/450x400/111827/ffffff?text=Issue+${magazine.issue}'`;
                modalContent.innerHTML = `
                    <div class="w-full md:w-1/2 p-0">
                        <img src="${coverPath}" alt="Cover of Cinefex Issue ${magazine.issue}" class="w-full h-full object-cover" onerror="${fallbackLogic}">
                    </div>
                    <div id="modal-dynamic-content" class="w-full md:w-2/2 p-6 sm:p-8 flex flex-col"></div>
                    <button id="modal-close" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors z-10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                displayArticleList(magazine);
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                document.getElementById('modal-close').addEventListener('click', closeModal);
            }

            function displayArticleList(magazine) {
                const dynamicContent = document.getElementById('modal-dynamic-content');
                let articlesHtml = magazine.articles.map(article => 
                    `<button class="article-btn w-full text-left px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-md font-semibold transition-colors text-white" data-article='${JSON.stringify(article)}' data-issue-number='${magazine.issue}'>${article.name}</button>`
                ).join('');

                dynamicContent.innerHTML = `
                    <div class="flex-grow overflow-y-auto">
                        <span class="text-sm font-semibold text-cyan-400">CINEFEX #${magazine.issue}</span>
                        <h2 class="text-2xl sm:text-3xl font-bold mt-2 mb-4">${magazine.title}</h2>
                        <p class="text-gray-300 leading-relaxed mb-6">${magazine.description}</p>
                        <h3 class="font-bold text-lg mb-3 text-gray-200">Articles</h3>
                        <div class="space-y-3">${articlesHtml}</div>
                    </div>
                `;

                dynamicContent.querySelectorAll('.article-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const articleData = JSON.parse(btn.dataset.article);
                        const issueNumber = parseInt(btn.dataset.issueNumber);
                        displayViewOptions({ ...magazine, issue: issueNumber }, articleData);
                    });
                });
            }

            function displayViewOptions(magazine, article) {
                const dynamicContent = document.getElementById('modal-dynamic-content');
                dynamicContent.innerHTML = `
                    <div class="flex-grow">
                        <button id="back-to-articles" class="text-sm text-cyan-400 hover:text-cyan-300 mb-4 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Back to Article List
                        </button>
                        <span class="text-sm font-semibold text-cyan-400">CINEFEX #${magazine.issue}</span>
                        <h2 class="text-2xl sm:text-3xl font-bold mt-2 mb-4">${article.name}</h2>
                        <p class="text-gray-300 leading-relaxed mb-6">Select a format to view the article.</p>
                    </div>
                    <div class="mt-auto flex flex-col sm:flex-row gap-4">
                        <button id="read-online-btn" class="flex-1 px-4 py-3 bg-cyan-600 hover:bg-cyan-500 rounded-md font-semibold transition-colors text-white">Read Online</button>
                        <button id="view-layout-btn" class="flex-1 px-4 py-3 bg-gray-600 hover:bg-gray-500 rounded-md font-semibold transition-colors text-white">View Original Layout</button>
                    </div>
                `;
                document.getElementById('back-to-articles').addEventListener('click', () => displayArticleList(magazine));
                document.getElementById('read-online-btn').addEventListener('click', () => openViewer(article.readingUrl, magazine.issue));
                document.getElementById('view-layout-btn').addEventListener('click', () => openViewer(article.archiveUrl, magazine.issue));
            }

            function closeModal() {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            function openViewer(url, issueNumber) {
                closeModal();
                viewerIframe.src = url;
                viewer.classList.remove('hidden');
                document.body.style.overflow = 'hidden';

                // Detect view type from URL
                const urlLower = url.toLowerCase();
                const isReadingView = urlLower.includes('readingview');
                const isArchivalView = urlLower.includes('archivalview') || urlLower.includes('manuscript');
                const isOldFormat = issueNumber <= 126;
                const isNewFormat = issueNumber >= 127;

                // Route to appropriate injection function based on format and view type
                viewerIframe.onload = () => {
                    if (isNewFormat && isReadingView) {
                        injectNewReadingViewStyles(viewerIframe);
                    } else if (isOldFormat && isArchivalView) {
                        injectOldArchivalViewStyles(viewerIframe);
                    } else if (isOldFormat && isReadingView) {
                        injectOldReadingViewStyles(viewerIframe);
                    }
                    // New format archival/manuscript view works well as-is, no injection needed
                };
            }
            
            /**
             * Injects styles into old format (≤126) archival view to fix cropping issues.
             * The old format used 864px width + 80px left margin designed for iPad app.
             * This fix removes the margin and allows natural scrolling through pages.
             */
            function injectOldArchivalViewStyles(iframe) {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc) return;

                    const style = doc.createElement('style');
                    style.textContent = `
                        /* Fix for OLD format archival view - remove margin and enable scrolling */
                        html {
                            margin: 0 !important;
                            padding: 0 !important;
                            background: #1a1a2e !important;
                            overflow: auto !important;
                        }
                        
                        body {
                            margin: 0 !important;
                            padding: 20px !important;
                            background: #1a1a2e !important;
                        }
                        
                        /* Style page wrapper elements - stack vertically */
                        page {
                            display: block !important;
                            margin: 0 auto 20px auto !important;
                            width: 864px !important;
                        }
                        
                        /* Override the float and ensure pages display as blocks */
                        .page {
                            float: none !important;
                            display: block !important;
                            margin: 0 auto !important;
                            box-shadow: 0 4px 30px rgba(0,0,0,0.6) !important;
                            border-radius: 4px !important;
                            /* Ensure background-size works correctly */
                            background-size: 864px 768px !important;
                        }
                        
                        /* Fix image sizing - original CSS sets 100% which causes issues */
                        img {
                            width: auto !important;
                            height: auto !important;
                            max-width: 100% !important;
                        }
                    `;
                    doc.head.appendChild(style);
                } catch (e) {
                    console.error("Failed to inject old archival styles into iframe:", e);
                }
            }

            /**
             * Injects styles into old format (≤126) reading view.
             * Fixes float containment and uses Benguiat font from central fonts folder.
             */
            function injectOldReadingViewStyles(iframe) {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc) return;

                    const style = doc.createElement('style');
                    style.textContent = `
                        /* Benguiat font definitions from central fonts folder */
                        @font-face {
                            font-family: "BenguiatStd-Book";
                            src: url("/fonts/BenguiatStd-Book.otf") format("opentype");
                            font-style: normal;
                        }
                        @font-face {
                            font-family: "BenguiatStd-BookItalic";
                            src: url("/fonts/BenguiatStd-BookItalic.otf") format("opentype");
                            font-style: italic;
                        }
                        @font-face {
                            font-family: "BenguiatStd-Medium";
                            src: url("/fonts/BenguiatStd-Medium.otf") format("opentype");
                            font-style: normal;
                        }
                        @font-face {
                            font-family: "BenguiatStd-MediumItalic";
                            src: url("/fonts/BenguiatStd-MediumItalic.otf") format("opentype");
                            font-style: italic;
                        }
                        @font-face {
                            font-family: "BenguiatStd-Bold";
                            src: url("/fonts/BenguiatStd-Bold.otf") format("opentype");
                            font-style: normal;
                            font-weight: bold;
                        }
                        
                        /* Override CaeciliaLTStd with Benguiat */
                        body {
                            font-family: "BenguiatStd-Book", Georgia, serif !important;
                        }
                        
                        em, i {
                            font-family: "BenguiatStd-BookItalic", Georgia, serif !important;
                            font-style: italic !important;
                        }
                        
                        /* Strong/bold - use Medium weight to match iPad app */
                        strong, b {
                            font-family: "BenguiatStd-Medium", Georgia, serif !important;
                            font-weight: normal !important;
                        }
                        
                        /* Article title - use Medium weight */
                        articleTitle {
                            font-family: "BenguiatStd-Medium", Georgia, serif !important;
                            font-weight: normal !important;
                        }
                        
                        .dropCap span {
                            font-family: "BenguiatStd-BookItalic", Georgia, serif !important;
                        }
                        
                        /* Page display - no clearing to allow content to flow alongside images */
                        page {
                            display: block !important;
                        }
                        
                        /* Only clear floats at footer and end of body */
                        .footer {
                            clear: both !important;
                            margin-top: 2em !important;
                        }
                        
                        body::after {
                            content: "" !important;
                            display: block !important;
                            clear: both !important;
                        }
                    `;
                    doc.head.appendChild(style);
                } catch (e) {
                    console.error("Failed to inject old reading styles into iframe:", e);
                }
            }

            /**
             * Injects styles into new format (≥127) reading view to improve typography.
             * Uses centralized fonts and improves layout for web display.
             */
            function injectNewReadingViewStyles(iframe) {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc) return;

                    // Remove existing stylesheets that have broken font paths
                    const existingStyles = doc.querySelectorAll('link[rel="stylesheet"]');
                    existingStyles.forEach(link => {
                        if (link.href.includes('Cinefex.css')) {
                            link.remove();
                        }
                    });
            
                    // Create optimized stylesheet for NEWER issues (127+)
                    // Insert at START of head to ensure our @font-face rules take precedence
                    const style = doc.createElement('style');
                    style.textContent = `
                        /* Central font definitions - using absolute paths to /fonts/ */
                        @font-face {
                            font-family: "BenguiatStd-Book";
                            src: url("/fonts/BenguiatStd-Book.otf") format("opentype");
                            font-style: normal;
                        }
                        @font-face {
                            font-family: "BenguiatStd-BookItalic";
                            src: url("/fonts/BenguiatStd-BookItalic.otf") format("opentype");
                            font-style: italic;
                        }
                        @font-face {
                            font-family: "BenguiatStd-Medium";
                            src: url("/fonts/BenguiatStd-Medium.otf") format("opentype");
                            font-style: normal;
                        }
                        @font-face {
                            font-family: "BenguiatStd-MediumItalic";
                            src: url("/fonts/BenguiatStd-MediumItalic.otf") format("opentype");
                            font-style: italic;
                        }
                        @font-face {
                            font-family: "BenguiatStd-Bold";
                            src: url("/fonts/BenguiatStd-Bold.otf") format("opentype");
                            font-style: normal;
                            font-weight: bold;
                        }
                        @font-face {
                            font-family: "GillSansStd";
                            src: url("/fonts/GillSansStd.otf") format("opentype");
                            font-style: normal;
                        }
                        @font-face {
                            font-family: "GillSansStd-Italic";
                            src: url("/fonts/GillSansStd-Italic.otf") format("opentype");
                            font-style: italic;
                        }
                        @font-face {
                            font-family: "GillSans-Bold";
                            src: url("/fonts/GillSans Bold.tt") format("truetype");
                            font-weight: bold;
                        }
                        @font-face {
                            font-family: "FuturaStd-ExtraBold";
                            src: url("/fonts/FuturaStd-ExtraBold.otf") format("opentype");
                            font-weight: bold;
                        }
                        @font-face {
                            font-family: "DucDeBerryLTStd";
                            src: url("/fonts/DucDeBerryLTStd.otf") format("opentype");
                            font-style: normal;
                        }

                        /* Layout improvements */
                        html, body {
                            margin: 0 !important;
                            padding: 0 !important;
                            box-sizing: border-box !important;
                        }
                        
                        body {
                            background-color: #f8f9fa !important;
                            color: #1e293b !important;
                            padding: 2rem 4rem !important;
                            max-width: 1024px !important;
                            margin-left: auto !important;
                            margin-right: auto !important;
                        }
                        
                        /* Manuscript/reading view styling - matches original iPad app */
                        .manuscript, .manuscript01 {
                            font-family: "BenguiatStd-Book", Georgia, serif !important;
                            font-size: 16px !important;
                            line-height: 30px !important;
                            text-align: justify !important;
                            padding: 20px !important;
                            height: auto !important;
                            width: auto !important;
                        }
                        
                        /* Target text container (div.page) */
                        .page {
                            font-family: "BenguiatStd-Book", Georgia, serif !important;
                            font-size: 16px !important;
                            line-height: 30px !important;
                            text-align: justify !important;
                            margin-bottom: 1.5em !important;
                            height: auto !important;
                            width: auto !important;
                        }
                        
                        /* Italic text */
                        em, i {
                            font-family: "BenguiatStd-BookItalic", Georgia, serif !important;
                            font-style: italic !important;
                        }
                        
                        /* Drop caps */
                        .dropCap span {
                            font-family: "BenguiatStd-BookItalic", Georgia, serif !important;
                        }
                        
                        /* Captions use GillSans */
                        .caption, .sideBar, .sideBarBottom {
                            font-family: "GillSansStd-Italic", "Gill Sans", sans-serif !important;
                        }
                        
                        /* Preserve image containers */
                        .img-all {
                            height: 660px !important;
                            display: block !important;
                            background-size: contain !important;
                            background-position: center !important;
                            background-repeat: no-repeat !important;
                        }
                        
                        /* Hide non-image background artifacts */
                        div:not(.img-all)[style*="background"] {
                            display: none !important;
                        }
                        
                        /* Page element display */
                        page {
                            display: block !important;
                            break-inside: avoid !important;
                        }
                    `;
                    
                    // Insert at the START of head so our @font-face rules are processed first
                    if (doc.head.firstChild) {
                        doc.head.insertBefore(style, doc.head.firstChild);
                    } else {
                        doc.head.appendChild(style);
                    }
            
                    // Title injection with fallback: dc:Title → Film → Creator
                    const titleText = extractTitle(doc);
                    if (titleText && doc.body) {
                        const existingH1 = doc.querySelector('h1.injected-title');
                        if (existingH1) existingH1.remove();
                        
                        const h1 = doc.createElement('h1');
                        h1.className = 'injected-title';
                        h1.textContent = titleText;
                        h1.style.cssText = `
                            font-size: 2.5rem;
                            font-weight: bold;
                            margin: 1.5rem 0;
                            border-bottom: 1px solid #d1d5db;
                            padding-bottom: 0.5rem;
                            text-align: left;
                        `;
                        doc.body.insertBefore(h1, doc.body.firstChild);
                    }
                } catch (e) {
                    console.error("Failed to inject new reading styles into iframe:", e);
                }
            }

            /**
             * Extracts article title from meta tags with fallback chain.
             * Issue 127 uses Film meta, 142+ uses dc:Title
             */
            function extractTitle(doc) {
                const dcTitle = doc.querySelector('meta[name="dc:Title"]');
                if (dcTitle) return dcTitle.getAttribute('content');
                
                const filmMeta = doc.querySelector('meta[name="Film"]');
                if (filmMeta) return filmMeta.getAttribute('content');
                
                const creatorMeta = doc.querySelector('meta[name="Creator"]');
                if (creatorMeta) return `Article by ${creatorMeta.getAttribute('content')}`;
                
                return null;
            }
            
            function closeViewer() {
                viewer.classList.add('hidden');
                viewerIframe.src = '';
                document.body.style.overflow = '';
            }
            
            modalOverlay.addEventListener('click', closeModal);
            viewerCloseBtn.addEventListener('click', closeViewer);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!viewer.classList.contains('hidden')) closeViewer();
                    else if (!modal.classList.contains('hidden')) closeModal();
                }
            });
            
            // Initialize the entire application
            initializeArchive();
        });
    </script>

</body>
</html>
