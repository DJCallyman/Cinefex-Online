# nginx server config for the Cinefex archive container.
#
# Dropped into /etc/nginx/conf.d/default.conf by the Dockerfile.
# Container-internal listener only — NPM terminates TLS upstream, so this
# file deliberately binds to plain HTTP on a single port.
#
# Notes:
#   * No SPA fallback: the React app uses HashRouter, so deep links never
#     reach the server. A fallback would silently mask 404s for missing
#     covers/issues, which is the exact class of bug we just fixed.
#   * gzip_static serves the pre-built search_index.json.gz verbatim.
#   * /assets/ is fingerprinted by Vite, so 1y immutable is safe.
#   * Security headers (CSP, X-Frame-Options, etc.) are intentionally
#     NOT set here — see .htaccess.example and the follow-up PR.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Some article HTMLs are large.
    client_max_body_size 0;

    # Don't leak the nginx version in error pages / Server header.
    server_tokens off;

    # gzip on-the-fly + serve the pre-built .gz where present.
    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        application/xml
        image/svg+xml;

    # Vite-emitted fingerprinted bundles — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Data files regenerated on every container start — always revalidate.
    # no-cache means "revalidate before serving from cache" (not "never cache"),
    # so conditional GET (304) still avoids re-downloading an unchanged file.
    location = /issues_full.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /issues.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Search index changes whenever issues are re-scanned; always revalidate.
    location = /search_index.json {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /search_index.json.gz {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else: serve the file or 404. No rewrite to index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
