name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` invokes `covers:webp`, which shells out to the
      # system `cwebp` binary (provided by the `webp` package). The
      # convert-covers-to-webp.js script now fails fast if cwebp is
      # missing, so install it here for the Ubuntu runner.
      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Build
        run: npm run build
