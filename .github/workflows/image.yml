name: Build & publish image

# Build & publish the GHCR image only after the CI workflow has
# completed successfully on `main`. This prevents a broken image
# (failing tests/lint/typecheck) from being pushed to :latest.
#
# `workflow_run` fires after the referenced workflow finishes, on the
# same ref. We gate on `ci.yml` succeeding so a red CI blocks the
# image build. `workflow_dispatch` is kept for manual rebuilds (e.g.
# after a cover/font-only change that didn't touch CI-relevant paths).
#
# Note: `workflow_run` always runs on the default branch's copy of
# this workflow file, so the path filter that used to live on the
# `push` trigger is no longer applied here. Manual rebuilds via
# `workflow_dispatch` cover the "rebuild without a CI run" case.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # `workflow_run` fires for both success and failure of the upstream
  # workflow; skip the build unless CI actually passed.
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/djcallyman/cinefex-online
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern=\d{4}-\d{2}-\d{2}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
